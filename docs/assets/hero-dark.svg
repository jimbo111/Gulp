<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" width="960" height="372" viewBox="0 0 960 372" role="img" aria-labelledby="t d">
<title id="t">Gulp intercepting a request</title>
<desc id="d">A request held in Gulp's Intercept view is edited from role user to role admin, forwarded, and the response comes back with a mass-assignment finding.</desc>
<style>
    text { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; white-space: pre; }
    .ui { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif; }
    .ln { animation: ln 11s ease-out infinite both; }
    .held { animation: held 11s ease-in-out infinite both; opacity: 0; }
    .pulse { animation: pulse 1.1s ease-in-out infinite alternate; }
    .old { animation: old 11s ease-in-out infinite both; }
    .strike { animation: strike 11s ease-in-out infinite both; transform-origin: 273.36px 256px; }
    .new { animation: new 11s ease-out infinite both; }
    .fwd { animation: fwd 11s ease-in-out infinite both; }
    .res { animation: res 11s cubic-bezier(.2,.7,.2,1) infinite both; }
    .rs { animation: rs 11s ease-out infinite both; }
    .wait { animation: wait 11s linear infinite both; }
    .press { opacity: 0; animation: press 11s linear infinite both; }
    .find { animation: find 11s cubic-bezier(.2,.7,.2,1) infinite both; }
    @keyframes ln { 0% { opacity: 0; } 4% { opacity: 1; } 94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes held { 0%,9% { opacity: 0; } 13%,44% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes old { 0%,22% { opacity: 1; } 30%,94% { opacity: .45; } 100% { opacity: 0; } }
    @keyframes strike { 0%,22% { transform: scaleX(0); } 27%,94% { transform: scaleX(1); } 100% { transform: scaleX(1); opacity: 0; } }
    @keyframes new { 0%,28% { opacity: 0; transform: translateY(6px); } 33%,94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes fwd { 0%,40% { opacity: .25; } 45%,55% { opacity: 1; } 62%,94% { opacity: .25; } 100% { opacity: 0; } }
    @keyframes res { 0%,50% { opacity: 0; transform: translateX(24px); } 56%,94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes rs { 0%,54% { opacity: 0; } 59%,94% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes find { 0%,66% { opacity: 0; transform: translateY(10px); } 71%,94% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    @keyframes wait { 0%,46% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes press { 0%,44% { opacity: 0; } 45%,48% { opacity: 1; } 52%,100% { opacity: 0; } }
    @keyframes pulse { from { opacity: 1; } to { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      *, .ln, .old, .strike, .new, .fwd, .res, .rs, .find, .pulse { animation: none !important; }
      .held, .wait, .press { opacity: 0 !important; }
      .old { opacity: .45; }
    }
    </style>
<rect x="8.5" y="10.5" width="943" height="351" rx="12" fill="#161B22" stroke="#30363D"/>
<clipPath id="win"><rect x="8.5" y="10.5" width="943" height="351" rx="12"/></clipPath>
<g clip-path="url(#win)">
<rect x="8" y="10" width="944" height="41" fill="#1C2128"/>
<rect x="8" y="51" width="161.5" height="322" fill="#1C2128"/>
</g>
<rect x="8.5" y="10.5" width="943" height="351" rx="12" fill="none" stroke="#30363D"/>
<line x1="8.5" y1="50.5" x2="951.5" y2="50.5" stroke="#30363D"/>
<circle cx="32" cy="30.5" r="6" fill="#FF5F57"/><circle cx="52" cy="30.5" r="6" fill="#FEBC2E"/><circle cx="72" cy="30.5" r="6" fill="#28C840"/>

<line x1="169.5" y1="51" x2="169.5" y2="361.5" stroke="#30363D"/>
<text class="ui" x="32" y="84" font-size="13" font-weight="400" fill="#E6EDF3">Dashboard</text><rect x="20" y="96" width="138" height="27" rx="6" fill="#58A6FF" fill-opacity=".14"/><text class="ui" x="32" y="115" font-size="13" font-weight="600" fill="#58A6FF">Proxy</text><text class="ui" x="32" y="146" font-size="13" font-weight="400" fill="#E6EDF3">Target</text><text class="ui" x="32" y="177" font-size="13" font-weight="400" fill="#E6EDF3">Repeater</text><text class="ui" x="32" y="208" font-size="13" font-weight="400" fill="#E6EDF3">Fuzzer</text><text class="ui" x="32" y="239" font-size="13" font-weight="400" fill="#E6EDF3">Scanner</text><text class="ui" x="32" y="270" font-size="13" font-weight="400" fill="#E6EDF3">Decoder</text><text class="ui" x="32" y="301" font-size="13" font-weight="400" fill="#E6EDF3">Notebook</text>
<text class="ui" x="480.0" y="35" text-anchor="middle" font-size="13" font-weight="600" fill="#E6EDF3">Gulp</text>
<text class="ui" x="206" y="80" font-size="12.5" font-weight="600" fill="#8D96A0">Intercept</text>
<g class="held">
  <rect x="192" y="98" width="362" height="172" rx="7" fill="#3B2F14"/>
  <rect x="192" y="98" width="3" height="172" fill="#E3B341"/>
  <circle class="pulse" cx="506" cy="76" r="4" fill="#E3B341"/>
  <text class="ui" x="516" y="80" font-size="12.5" font-weight="600" fill="#E3B341">Held</text>
</g>
<text class="ln" style="animation-delay:0.15s" x="206" y="118" textLength="218.92"><tspan fill="#58A6FF" font-weight="600">POST</tspan><tspan fill="#E6EDF3"> /api/account HTTP/1.1</tspan></text><text class="ln" style="animation-delay:0.24s" x="206" y="141" textLength="151.56"><tspan fill="#8D96A0">Host</tspan><tspan fill="#E6EDF3">: shop.example</tspan></text><text class="ln" style="animation-delay:0.33s" x="206" y="164" textLength="218.92"><tspan fill="#8D96A0">Cookie</tspan><tspan fill="#E6EDF3">: session=7f3c9a21e0</tspan></text><text class="ln" style="animation-delay:0.42s" x="206" y="187" textLength="252.60"><tspan fill="#8D96A0">Content-Type</tspan><tspan fill="#E6EDF3">: application/json</tspan></text><text class="ln" style="animation-delay:0.60s" x="206" y="233" textLength="235.76"><tspan fill="#E6EDF3">{&quot;email&quot;:&quot;ana@shop.example&quot;,</tspan></text><text class="ln" style="animation-delay:0.69s" x="206" y="256" textLength="67.36"><tspan fill="#E6EDF3"> &quot;role&quot;:</tspan></text>
<g class="ln" style="animation-delay:.7s">
  <text class="old" x="273.36" y="256" textLength="50.52" fill="#E6EDF3">"user"</text>
  <line class="strike" x1="273.36" y1="251" x2="323.88" y2="251" stroke="#8D96A0" stroke-width="1.6"/>
</g>
<g class="new">
  <rect x="331.88" y="240" width="75.36" height="21" rx="4" fill="#11302A"/>
  <text x="335.88" y="256" textLength="67.36" fill="#3FB8A0" font-weight="600">"admin"<tspan fill="#E6EDF3" font-weight="400">}</tspan></text>
</g>
<g class="fwd">
  <rect x="206" y="286" width="92" height="28" rx="6" fill="none" stroke="#58A6FF"/>
  <text class="ui" x="252" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#58A6FF">Forward</text>
  <g class="press">
    <rect x="206" y="286" width="92" height="28" rx="6" fill="#1F6FEB"/>
    <text class="ui" x="252" y="305" text-anchor="middle" font-size="13" font-weight="600" fill="#FFFFFF">Forward</text>
  </g>
</g>
<line x1="570" y1="66" x2="570" y2="348" stroke="#30363D"/>
<text class="ui" x="596" y="80" font-size="12.5" font-weight="600" fill="#8D96A0">Response</text>
<text class="ui wait" x="596" y="118" font-size="13" fill="#8D96A0">Waiting for Forward</text>
<g class="res">
  <text class="rs" x="596" y="118" textLength="126.30"><tspan fill="#E6EDF3">HTTP/1.1 </tspan><tspan fill="#E6EDF3" font-weight="600">200 OK</tspan></text><text class="rs" x="596" y="141" textLength="252.60"><tspan fill="#8D96A0">Content-Type</tspan><tspan fill="#E6EDF3">: application/json</tspan></text><text class="rs" x="596" y="187" textLength="235.76"><tspan fill="#E6EDF3">{&quot;email&quot;:&quot;ana@shop.example&quot;,</tspan></text>
  <rect class="rs" x="659.36" y="194" width="66.94" height="21" rx="4" fill="#11302A"/>
  <text class="rs" x="596" y="210" textLength="134.72"><tspan fill="#E6EDF3"> "role":</tspan><tspan fill="#3FB8A0" font-weight="600">"admin"</tspan><tspan fill="#E6EDF3">}</tspan></text>
</g>
<g class="find">
  <rect x="590" y="240" width="334" height="74" rx="8" fill="#3D1D20"/>
  <rect x="590" y="240" width="3" height="74" fill="#FF7B72"/>
  <text class="ui" x="606" y="266" font-size="14" font-weight="600" fill="#FF7B72">Mass assignment</text>
  <text class="ui" x="908" y="266" text-anchor="end" font-size="12" font-weight="600" fill="#FF7B72">High</text>
  <text class="ui" x="606" y="288" font-size="13" fill="#E6EDF3">The server accepted "role" from the client.</text>
</g>
</svg>
