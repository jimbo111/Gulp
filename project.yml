name: Gulp
options:
  bundleIdPrefix: com.gulp
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  xcodeVersion: "16.0"

packages:
  GulpKit:
    path: Packages/GulpKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""           # set your Apple Developer team id for signed builds
    CODE_SIGN_STYLE: Automatic

targets:
  Gulp:
    type: application
    platform: macOS
    sources:
      - App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gulp.app
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Gulp.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - package: GulpKit
        product: GulpFeatures
      - package: GulpKit
        product: GulpUI
      - package: GulpKit
        product: GulpWorkspace
      # Built (not linked) so the phase below can embed it.
      - package: GulpKit
        product: gulp-cli
        link: false
    # Embed the CLI so users can symlink it into their PATH (docs/02 §4).
    postCompileScripts:
      - script: |
          set -euo pipefail
          DEST="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$DEST"
          cp "$BUILT_PRODUCTS_DIR/gulp-cli" "$DEST/gulp"
        name: Embed gulp-cli
        inputFiles:
          - $(BUILT_PRODUCTS_DIR)/gulp-cli
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/gulp

  GulpAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - UITests
    settings:
      base:
        # The UI-test bundle has no checked-in Info.plist, so let Xcode synthesize one
        # (without this, code signing fails: "target does not have an Info.plist file").
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gulp.app.uitests
    dependencies:
      - target: Gulp
      # The end-to-end test starts VulnLab from the built products (not linked).
      - package: GulpKit
        product: gulp-vulnlab
        link: false

schemes:
  Gulp:
    build:
      targets:
        Gulp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - GulpAppUITests
      # test_REP002 sends from the app to a VulnLab started here (the sandboxed UI-test runner
      # cannot listen on a port itself). The port is the test's `vulnLabPort`.
      preActions:
        - name: Start VulnLab
          settingsTarget: GulpAppUITests
          script: |
            pkill -f "gulp-vulnlab --port 28188" || true
            "$BUILT_PRODUCTS_DIR/gulp-vulnlab" --port 28188 --raw-port 28189 --tls-port 28190 \
              > "$TARGET_TEMP_DIR/vulnlab.log" 2>&1 &
            for _ in $(seq 1 50); do
              curl -s -o /dev/null http://127.0.0.1:28188/ && exit 0
              sleep 0.2
            done
            echo "VulnLab did not start; see $TARGET_TEMP_DIR/vulnlab.log" >&2
            exit 1
      postActions:
        - name: Stop VulnLab
          script: pkill -f "gulp-vulnlab --port 28188" || true
