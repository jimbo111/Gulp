name: CI

# The gate for every push and pull request: Linux (Swift 6.1: core tests, rule gates, every DoD
# script) and macOS (Xcode 16.4: lint, core tests, the browser checks incl. the beta check, app build,
# UI tests). Run `make test` + `make lint`
# locally first; CI is what the change has to pass.

on:
  # Every push to any branch (main and short-lived work branches), PRs, and manual runs.
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-linux:
    name: Core (Linux, Swift 6)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite with GRDB-required features (snapshot, FTS5)
        # Ubuntu's libsqlite3 is built WITHOUT SQLITE_ENABLE_SNAPSHOT, so GRDB 7's
        # DatabaseSnapshotPool/WALSnapshot fail to link (undefined sqlite3_snapshot_*).
        # Build a SQLite with the flags GRDB expects and the project uses (FTS5 for HIS-050),
        # installed to /usr/local so the linker resolves -lsqlite3 to it. (docs/07 ADR)
        run: |
          apt-get update && apt-get install -y build-essential curl libsqlite3-dev zlib1g-dev
          curl -fsSL https://www.sqlite.org/2024/sqlite-autoconf-3460100.tar.gz -o /tmp/sqlite.tar.gz
          mkdir -p /tmp/sqlite-src
          tar xzf /tmp/sqlite.tar.gz -C /tmp/sqlite-src --strip-components=1
          cd /tmp/sqlite-src
          CFLAGS="-O2 -DSQLITE_ENABLE_SNAPSHOT=1 -DSQLITE_ENABLE_FTS5=1 -DSQLITE_ENABLE_RTREE=1 -DSQLITE_ENABLE_JSON1=1" \
            ./configure --prefix=/usr/local
          make -j"$(nproc)"
          make install
          ldconfig
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            Packages/GulpKit/.build
            Beacon/.build
          key: spm-linux-${{ hashFiles('Packages/GulpKit/Package.resolved', 'Beacon/Package.resolved') }}
          restore-keys: spm-linux-
      - name: Build GulpKit
        run: swift build --package-path Packages/GulpKit -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
      - name: Test GulpKit
        run: swift test --package-path Packages/GulpKit --parallel -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
      - name: Architecture invariants (dependency direction + platform rules)
        run: Scripts/arch-check.sh
      - name: Hard rules (scope-safe sends, seeded tests, no silent store writes, issue ids, Sendable, keys)
        run: Scripts/rules-check.sh
      - name: M1 Definition of Done (gulp-cli + VulnLab byte fidelity)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m1-dod.sh
      - name: M2 Definition of Done (proxy -> store, 10k requests, reopen)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m2-dod.sh
      - name: M3a Definition of Done (HTTPS interception, Gulp CA trusted, history decrypted)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m3a-dod.sh
      - name: M3b Definition of Done (curl --http2 through Gulp, h2 upstream, trailers, history)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m3b-dod.sh
      - name: M4a Definition of Done (intercept edit, match & replace header, Copy as cURL)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m4a-dod.sh
      - name: M4b Definition of Done (curl -N SSE streams through Gulp, WebSockets history)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m4b-dod.sh
      - name: M5 Definition of Done (single-packet race on /race/redeem, paste cURL, /sse in a Repeater tab)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m5-dod.sh
      - name: M6a Definition of Done (site map from proxy traffic, scope hides items, out-of-scope Repeater send held)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m6a-dod.sh
      - name: M6b Definition of Done (OpenAPI → site map, HAR round trip, other-proxy imports, MCP over stdio)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m6b-dod.sh
      - name: M7 Definition of Done (Decoder chain, Smart Decode, 1 MB word diff, JWT attacks on /api/me vs /safe/api/me, Transform Tags)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m7-dod.sh
      - name: M8 Definition of Done (10,000-request cluster bomb ≥ 1,000 req/s, CSRF grep-extract, Discover content)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m8-dod.sh
      - name: M9 Definition of Done (GulpQL over 1M rows < 2 s via the status index, 1M-row open < 3 s, reflected(), coverage, Notebook, search < 200 ms)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m9-dod.sh
      - name: Proxy performance budgets (doc 01 §9, release build; added latency < 5 ms, ≥ 2,000 req/s, nothing lost)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/perf-dod.sh
      - name: M10a Definition of Done (browsing VulnLab yields exactly the manifest's passive issues, none on /safe/*, no duplicates)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m10a-dod.sh
      - name: M10b Definition of Done (gRPC through the proxy decodes; reflection and .proto name fields; edited re-send; gRPC-Web text + Connect; protobuf-field fuzzing)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m10b-dod.sh
      - name: M11a Definition of Done (static crawl of VulnLab; dev Beacon + interactsh loops; shared caps and backoff; panic stop)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m11a-dod.sh
      - name: M11b Definition of Done (active audit of VulnLab finds every planted P0 vulnerability incl. 3 OAST checks; nothing on the safe twins)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m11b-dod.sh
      - name: M11c Definition of Done (scanner accuracy incl. gRPC SQLi; crawl and audit; OpenAPI scan; re-test)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m11c-dod.sh
      - name: M11c check-catalog Definition of Done (server-side prototype pollution & mass assignment fire; safe twins clean)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m11c-checks-dod.sh
      - name: M12a Definition of Done (request signing DPoP/RFC9421/SigV4 verified by VulnLab; login-macro re-auth across expiry)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m12a-dod.sh
      - name: M12b Definition of Done (Authz Matrix flags the IDOR as a bypass; the /safe twin is Enforced)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m12b-dod.sh
      - name: M13b GraphQL Definition of Done (introspect /graphql, render the schema, flag the field-level authz bug)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/m13b-graphql-dod.sh
      - name: Recon Definition of Done (passive secret & JS-endpoint recon flags planted secrets, clean safe twins)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/recon-dod.sh
      - name: Reporting Definition of Done (HTML + Markdown report from issues)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/report-dod.sh
      - name: Check Recipes Definition of Done (a no-code YAML/JSON recipe detects a custom header leak)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/recipe-dod.sh
      - name: Sequencer Definition of Done (a counter token rates Poor, a CSPRNG token rates Excellent)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/sequencer-dod.sh
      - name: DOM Probe Definition of Done (real Chromium reports the DOM XSS on /spa, clean on the safe twin)
        run: Scripts/m13a-dom-probe-dod.sh
      - name: Parameter Discovery Definition of Done (hidden debug/trace found on /params, clean on the safe twin)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/paramdisc-dod.sh
      - name: Smuggling Probe Definition of Done (CL.TE/TE.CL timing differential on /smuggle, clean on the safe twin)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/smuggle-dod.sh
      - name: "Smuggling confirmation workbench Definition of Done (ADV-032: constructs, warns, never auto-sends)"
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/smuggle-confirm-dod.sh
      - name: CSWSH Definition of Done (/ws accepts a cross-site handshake, /safe/ws rejects it)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/cswsh-dod.sh
      - name: JS Recon Definition of Done (reconstruct source map, mine params, flag literals on /recon/app.js)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/jsrecon-dod.sh
      - name: JS Recon asset-diff Definition of Done (app.v2.js vs app.js surfaces new params/literals)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/jsrecon-diff-dod.sh
      - name: WS per-message authz Definition of Done (/ws/authz handshake-only, /safe/ws/authz per-message)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/wsauthz-dod.sh
      - name: WS Fuzzer Definition of Done (ws-fuzz drives one socket, greps and extracts each reply)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/wsfuzz-dod.sh
      - name: "WS OAST Definition of Done (WSX-005: a WebSocket message triggers a correlated blind-SSRF interaction)"
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/wsoast-dod.sh
      - name: "WS script Definition of Done (WSX-008: a send/expect sequence runs over one socket)"
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/wsscript-dod.sh
      - name: Parameter Pollution Definition of Done (/pollute resolves duplicates last-wins, /safe/pollute first-wins)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/pollute-dod.sh
      - name: "SSO Workbench Definition of Done (F25: AS over-accepts redirect_uri + PKCE downgrade; safe twin strict)"
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/sso-dod.sh
      - name: "Issue retest Definition of Done (F30 DRF: still-vuln→fixed after patch; --fail-on-regression exits non-zero)"
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/retest-dod.sh
      - name: "Cache poisoning/deception Definition of Done (F28 WCP-002/003: confirmed-cached poison + deception; safe twins clean)"
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/cache-dod.sh
      - name: "LLM security Definition of Done (F32 LLM-002/009: prompt injection + MCP tool poisoning; guarded twins clean)"
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/llm-dod.sh
      - name: JS extension host type-check (JavaScriptCore shim; catches cross-platform errors)
        env:
          SWIFTPM_FLAGS: -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
        run: Scripts/jsc-host-typecheck.sh
      - name: Build Beacon
        run: swift build --package-path Beacon -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib
      - name: Test Beacon
        run: swift test --package-path Beacon --parallel -Xcc -I/usr/local/include -Xlinker -L/usr/local/lib

  macos:
    name: App + full test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # Needs Swift 6.1+ (swift-crypto >= 4.5.1 requires tools 6.1): Xcode 16.4 ships Swift 6.1.2.
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install tools
        # swift-format ships with the toolchain (`swift format`); only XcodeGen is needed.
        run: brew install xcodegen
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: Packages/GulpKit/.build
          key: spm-macos-${{ hashFiles('Packages/GulpKit/Package.resolved') }}
          restore-keys: spm-macos-
      - name: Lint
        run: make lint
      - name: Generate project
        run: make generate
      - name: Core tests
        run: make test-core
      - name: M4b browser check (headless Chrome through Gulp, F16 test 1)
        run: Scripts/m4b-browser.sh
      # macOS, not Linux: its first step browses through the Gulp Browser, which needs the Chrome
      # this runner ships (the Linux container has none, and the script fails rather than skips in CI).
      - name: Daily-driver beta check (one project through browser, intercept, race, discovery, JWT, OpenAPI, search, Notebook; quit and reopen)
        run: Scripts/beta-dod.sh
      - name: Build app
        run: make build
      - name: App + UI tests
        run: make test

  release:
    name: Release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    needs: [core-linux, macos]
    steps:
      - uses: actions/checkout@v4
      - name: Note
        run: echo "Release packaging runs Scripts/release.sh with signing secrets (docs/02 §8)."
